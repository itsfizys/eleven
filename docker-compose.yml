services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
      --tcp-backlog 128
      --timeout 0
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - internal

  pg:
    image: postgres:16-alpine
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=4MB
      -c work_mem=4MB
      -c max_connections=50
      -c autovacuum=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  migrate:
    image: node:26-alpine
    container_name: migrate
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install --include=dev --ignore-scripts && npm run migrate"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      pg:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  eleven:
    image: node:26-alpine
    container_name: eleven
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "apk add --no-cache postgresql-client && npm install --include=dev --ignore-scripts && npm run build && npm run start"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "6969:6969"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  portainer-data:
