name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: zip -r dist.zip README.md .env.example package.json package-lock.json dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          generate_release_notes: true
